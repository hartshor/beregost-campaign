<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Township of Beregost — Printable Black & White Town Map</title>
  <style>
    @page {
      size: landscape;
      margin: 0.2in;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #e6e2d8;
      font-family: Georgia, "Times New Roman", serif;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .print-toolbar {
      width: 100%;
      max-width: 1350px;
      background: #161b22;
      color: #f0f6fc;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .btn {
      background: #e3b341;
      color: #000;
      border: 2px solid #e3b341;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-outline {
      background: transparent;
      color: #79c0ff;
      border: 1.5px solid #58a6ff;
    }
    .btn-outline.active {
      background: rgba(88,166,255,0.2);
      color: #fff;
      border-color: #79c0ff;
    }
    .map-sheet {
      width: 100%;
      max-width: 1350px;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      border: 1px solid #000;
    }
    .map-sheet img {
      width: 100%;
      height: auto;
      display: block;
    }
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .print-toolbar {
        display: none !important;
      }
      .map-sheet {
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
      }
      .map-sheet img {
        max-height: 98vh;
        width: auto;
        max-width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="print-toolbar">
    <div>
      <strong style="font-size:1.05rem; color:#e3b341;">🗺️ Township of Beregost — Printable B&amp;W Town Map</strong>
      <div style="font-size:0.8rem; color:#8b949e; margin-top:2px;">
        Default: Spoiler-Free Hand-Inked Player Handout Map (Building Names Only, Stonecrest Manor, 1 West / 1 East / 1 North Dirt Path).
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button id="btn-player" class="btn btn-outline active" onclick="setMapStyle('player')">🗺️ Player Map (Hand-Inked)</button>
      <button id="btn-vector" class="btn btn-outline" onclick="setMapStyle('vector')">📐 Clean Vector</button>
      <button id="btn-woodcut" class="btn btn-outline" onclick="setMapStyle('woodcut')">✒️ DM Woodcut</button>
      <button id="btn-schematic" class="btn btn-outline" onclick="setMapStyle('schematic')">📋 DM Schematic</button>
      <button class="btn" onclick="window.print()">🖨️ Print Map (B&amp;W)</button>
      <a id="download-link" class="btn btn-outline" href="beregost_town_map_player_bw.jpg" download="beregost_town_map_player_bw.jpg">⬇️ Download Map</a>
    </div>
  </div>
  <div class="map-sheet">
    <img id="printable-map-img" src="beregost_town_map_player_bw.jpg?v=3" alt="Township of Beregost Printable Black and White Player Map" />
  </div>
  <script>
    function setMapStyle(style) {
      const img = document.getElementById('printable-map-img');
      const dl = document.getElementById('download-link');
      const btns = {
        player: document.getElementById('btn-player'),
        vector: document.getElementById('btn-vector'),
        woodcut: document.getElementById('btn-woodcut'),
        schematic: document.getElementById('btn-schematic')
      };
      Object.values(btns).forEach(b => b && b.classList.remove('active'));
      if (style === 'vector') {
        img.src = 'beregost_town_map_player_bw.svg?v=3';
        dl.href = 'beregost_town_map_player_bw.svg';
        dl.download = 'beregost_town_map_player_bw.svg';
        btns.vector.classList.add('active');
      } else if (style === 'woodcut') {
        img.src = 'beregost_town_map_woodcut_labeled_bw.png';
        dl.href = 'beregost_town_map_woodcut_labeled_bw.png';
        dl.download = 'beregost_town_map_woodcut_labeled_bw.png';
        btns.woodcut.classList.add('active');
      } else if (style === 'schematic') {
        img.src = 'beregost_town_map_bw.png';
        dl.href = 'beregost_town_map_bw.png';
        dl.download = 'beregost_town_map_bw.png';
        btns.schematic.classList.add('active');
      } else {
        img.src = 'beregost_town_map_player_bw.jpg?v=3';
        dl.href = 'beregost_town_map_player_bw.jpg';
        dl.download = 'beregost_town_map_player_bw.jpg';
        btns.player.classList.add('active');
      }
    }
  </script>
</body>
</html>
